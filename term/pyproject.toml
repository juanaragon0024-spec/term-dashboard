[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "term-dashboard"
version = "0.1.0"
description = "Term -- TUI dashboard for Claude Code. Vivid syntax highlighting, dark theme, CLI OAuth."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=3.0",
    "rich>=13.0",
]

[project.scripts]
term = "term.app:main"

[tool.setuptools.packages.find]
where = ["."]
